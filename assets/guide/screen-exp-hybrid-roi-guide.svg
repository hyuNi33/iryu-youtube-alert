<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">경험치 바와 LV 영역 지정 예시</title>
  <desc id="desc">실선 빨간 박스는 경험치바의 초록색과 회색 바 영역만 감싸고, 점선 빨간 LV 박스는 레벨 표시 글자만 감쌉니다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#76cfff"/>
      <stop offset="0.55" stop-color="#e8f9ff"/>
      <stop offset="1" stop-color="#99d987"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2fb344"/>
      <stop offset="0.55" stop-color="#71e65d"/>
      <stop offset="1" stop-color="#c5ff99"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="18" fill="url(#sky)"/>

  <g opacity="0.72">
    <circle cx="110" cy="62" r="44" fill="#fff"/>
    <circle cx="156" cy="55" r="32" fill="#fff"/>
    <circle cx="950" cy="86" r="58" fill="#fff"/>
    <circle cx="1012" cy="78" r="38" fill="#fff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="40" width="158" height="58" rx="9" fill="#27384d" opacity="0.9"/>
    <text x="100" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">LV.484</text>
    <rect x="742" y="38" width="104" height="60" rx="12" fill="#334155" opacity="0.9"/>
    <text x="770" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#dbeafe">스킬</text>
    <rect x="874" y="38" width="104" height="60" rx="12" fill="#334155" opacity="0.9"/>
    <text x="902" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#dbeafe">장비</text>
  </g>

  <rect x="38" y="292" width="1124" height="78" rx="14" fill="#8b6537" filter="url(#shadow)"/>
  <path d="M42 314 C148 272 248 354 360 313 C468 274 574 354 684 314 C802 272 904 356 1010 314 C1074 290 1115 302 1158 316 L1158 370 L42 370 Z" fill="#5c3f20" opacity="0.55"/>

  <g id="exp-ui" transform="translate(82 236)">
    <rect x="0" y="0" width="1036" height="48" rx="10" fill="#111827" opacity="0.70"/>
    <text x="423" y="18" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" stroke="#1f2937" stroke-width="5" paint-order="stroke">56.70% (1,016,838,523,866 / 1,793,435,540,866)</text>
    <rect x="14" y="26" width="1008" height="14" rx="7" fill="#d1d5db"/>
    <rect x="14" y="26" width="575" height="14" rx="7" fill="url(#barFill)"/>
    <rect x="14" y="26" width="575" height="6" rx="3" fill="#d8ffd0" opacity="0.8"/>
  </g>

  <rect x="96" y="262" width="1008" height="14" rx="2" fill="none" stroke="#ef4444" stroke-width="5"/>
  <rect x="70" y="34" width="176" height="72" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="5" stroke-dasharray="14 9"/>
  <rect x="70" y="12" width="48" height="24" rx="4" fill="#ef4444"/>
  <text x="84" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">LV</text>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="392" height="106" rx="10" fill="#0f172a" opacity="0.94"/>
    <text x="78" y="168" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">LV 점선 박스</text>
    <text x="78" y="200" font-family="Arial, sans-serif" font-size="21" fill="#e5e7eb">레벨 표시 글자만 감싸기</text>
    <path d="M160 132 L136 96" fill="none" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="756" y="132" width="384" height="106" rx="10" fill="#0f172a" opacity="0.94"/>
    <text x="782" y="168" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">경험치 바 실선 박스</text>
    <text x="782" y="200" font-family="Arial, sans-serif" font-size="21" fill="#e5e7eb">초록/회색 띠만 감싸기</text>
    <path d="M930 238 L930 262" fill="none" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="170" y="398" width="860" height="64" rx="12" fill="#fff" opacity="0.97"/>
    <text x="216" y="437" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">숫자와 아이콘은 제외하고, 바 색상과 LV 글자만 각각 잡으세요</text>
  </g>

  <text x="96" y="292" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ef4444">경험치 측정 영역</text>
</svg>
