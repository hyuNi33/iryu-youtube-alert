<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경험치 측정 - 이류월드</title>
  <script>(function(){var p=localStorage.getItem('iryu_theme')||'system';var t=p;if(p==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/common.js"></script>
  <link rel="icon" href="../../assets/mainImg.png">
  <style>
    .measure-panel { overflow: hidden; }
    .measure-panel[hidden] { display: none; }
    .measure-page .tab-bar { flex-wrap: wrap; }
    .measure-frame { display: block; width: 100%; height: 1200px; min-height: 620px; border: 0; background: transparent; overflow: hidden; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <aside class="sidebar"></aside>
      <main class="content">
        <div class="top-banner">
          <h1>경험치 측정</h1>
          <p>직접 입력과 타이머로 획득량을 측정하고, 경험치바 색 경계 자동 측정과 비교합니다.</p>
        </div>

        <section class="calc-card measure-page">
          <div class="tab-bar" role="tablist" aria-label="경험치 측정 방식">
            <button type="button" id="legacyTab" class="tab-btn" role="tab" aria-selected="false" aria-controls="legacyPanel" tabindex="-1" data-mode="legacy">기존 경험치 측정</button>
            <button type="button" id="manualTab" class="tab-btn active" role="tab" aria-selected="true" aria-controls="livePanel" tabindex="0" data-mode="manual">직접 입력 · 권장</button>
            <button type="button" id="autoTab" class="tab-btn" role="tab" aria-selected="false" aria-controls="livePanel" tabindex="-1" data-mode="auto">색 경계 자동 측정</button>
          </div>
          <div class="measure-panel" id="legacyPanel" role="tabpanel" aria-labelledby="legacyTab" hidden>
            <iframe class="measure-frame" id="legacyFrame" src="../calc/exp.html?embed=screenExp" title="기존 경험치 측정" allow="display-capture" scrolling="no"></iframe>
          </div>
          <div class="measure-panel" id="livePanel" role="tabpanel" aria-labelledby="manualTab">
            <iframe class="measure-frame" id="liveFrame" src="../calc/exp-ocr-lab.html?embed=1" title="직접 입력 경험치 측정" allow="display-capture" scrolling="no"></iframe>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    let activeMode = 'manual';
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    function syncMode() {
      document.getElementById('liveFrame').contentWindow?.postMessage({type:'iryuMeasureMode', mode:activeMode==='legacy'?'manual':activeMode},location.origin);
    }
    function selectTab(button) {
      activeMode=button.dataset.mode;
      tabs.forEach(tab=>{const active=tab===button;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;});
      document.getElementById('legacyPanel').hidden=activeMode!=='legacy';
      document.getElementById('livePanel').hidden=activeMode==='legacy';
      if(activeMode!=='legacy') {
        document.getElementById('livePanel').setAttribute('aria-labelledby',button.id);
        document.getElementById('liveFrame').title=button.textContent+' 경험치 측정';
      }
      syncMode();
      requestFrameHeight(document.getElementById(activeMode==='legacy'?'legacyFrame':'liveFrame'));
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectTab(tab));
      tab.addEventListener('keydown',event=>{
        let next;
        if(event.key==='ArrowRight')next=(index+1)%tabs.length;
        if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;
        if(event.key==='Home')next=0;
        if(event.key==='End')next=tabs.length-1;
        if(next===undefined)return;event.preventDefault();tabs[next].focus();selectTab(tabs[next]);
      });
    });
    document.getElementById('liveFrame').addEventListener('load',syncMode);
    window.addEventListener('load',syncMode);
    function requestFrameHeight(frame) {
      if (!frame?.contentWindow) return;
      frame.contentWindow.postMessage({ type: "iryuMeasureRequestHeight" }, location.origin);
    }

    function syncFrameTheme(frame) {
      if (!frame?.contentWindow) return;
      frame.contentWindow.postMessage({
        type: "iryuMeasureTheme",
        theme: document.documentElement.getAttribute("data-theme") || "light"
      }, location.origin);
    }

    function syncAllFrameThemes() {
      document.querySelectorAll(".measure-frame").forEach(frame => syncFrameTheme(frame));
    }

    window.addEventListener("message", event => {
      if (event.origin !== location.origin) return;
      if (event.data?.type !== "iryuMeasureFrameHeight") return;
      const frame = Array.from(document.querySelectorAll(".measure-frame"))
        .find(item => item.contentWindow === event.source);
      if (!frame) return;
      frame.style.height = `${Math.max(760, Math.ceil(Number(event.data.height) || 0))}px`;
    });

    window.addEventListener("load", () => {
      document.querySelectorAll(".measure-frame").forEach(frame => {
        syncFrameTheme(frame);
        requestFrameHeight(frame);
      });
    });

    document.querySelectorAll(".measure-frame").forEach(frame => {
      frame.addEventListener("load", () => syncFrameTheme(frame));
    });

    if (window.MutationObserver) {
      new MutationObserver(syncAllFrameThemes).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
      });
    }
  </script>
</body>
</html>
