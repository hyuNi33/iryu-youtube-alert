<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>누적 RP 스킬 추천 - 이류월드</title>
  <script>(function(){var p=localStorage.getItem('iryu_theme')||'system';var t=p;if(p==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="icon" href="../../assets/mainImg.png">
  <script src="../../js/common.js"></script>
  <style>
    html[data-theme="dark"] { color-scheme: dark; }
    .rp-inputs { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .rp-inputs label { display: grid; gap: 6px; }
    .rp-inputs input { max-width: 100%; }
    .rp-inputs .btn { min-height: 44px; }
    .rp-inputs .btn:disabled { opacity: .55; cursor: default; }
    .rp-results { margin-top: 16px; }
    .rp-results h2 { color: var(--section-title-color); }
    .rp-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 168px), 1fr));
      gap: 12px;
      margin: 16px 0 24px;
    }
    .rp-summary > div {
      display: grid;
      align-content: start;
      gap: 8px;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--result-border);
      border-radius: 14px;
      background: var(--result-bg);
    }
    .rp-summary dt {
      color: var(--result-label-color);
      font-size: .875rem;
      font-weight: 600;
    }
    .rp-summary dd {
      color: var(--result-value-color);
      font-size: clamp(1.0625rem, 1.6vw, 1.375rem);
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .rp-summary .rp-summary-highlight {
      border-color: var(--result-highlight);
      background: var(--tag-bg);
    }
    .rp-summary-highlight dd { color: var(--tag-color); }
    .rp-summary .table-tip-trigger { text-align: left; }
    .rp-summary .table-tip-trigger:focus-visible {
      outline: 2px solid var(--result-highlight);
      outline-offset: 4px;
      border-radius: 2px;
    }
    .rp-summary-detail { display: block; margin-top: 8px; font-size: .875rem; font-weight: 600; }
    .rp-summary-detail[hidden] { display: none; }
    .rp-results-table { overflow-x: auto; }
    .rp-results table { width: 100%; border-collapse: collapse; }
    .rp-results th, .rp-results td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    .rp-results td:nth-child(4) { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <aside class="sidebar"></aside>
      <main class="content">
        <nav class="tab-bar rp-recommend-tabs" aria-label="승천2 이후 RP 투자 추천">
          <a class="tab-btn" href="./rp-30day-plan.html">일일 RP 추천</a>
          <a class="tab-btn active" href="./rp-skill-recommend.html" aria-current="page">누적 RP 추천</a>
        </nav>
        <header class="top-banner">
          <h1>누적 RP 스킬 추천</h1>
          <p>승천 1단계까지의 스킬을 모두 달성한 상태로 계산합니다.</p>
          <p>승천3부터는 승천의 공명 먼저 투자 후 남은 RP로 다른 RP스킬들을 추천합니다.</p>
        </header>
        <section class="calc-card">
          <form id="rp-form" class="rp-inputs">
            <label>승천 단계
              <select name="stage" class="table-dropdown">
                <option value="12">승천2</option>
                <option value="13">승천3</option>
                <option value="14">승천4</option>
              </select>
            </label>
            <label>누적 RP
              <input name="total" type="text" inputmode="decimal" required>
            </label>
            <label>단위
              <select name="unit" class="table-dropdown">
                <option value="RP">RP</option>
                <option value="경">경</option>
                <option value="해">해</option>
              </select>
            </label>
            <button type="submit" class="btn" disabled>추천 계산</button>
          </form>
          <p id="rp-status" role="status">스킬 데이터를 불러오는 중입니다.</p>
        </section>
        <section id="rp-results" class="calc-card rp-results" hidden>
          <h2>추천 투자</h2>
          <dl class="rp-summary">
            <div>
              <dt>승천1까지 사용한 RP</dt>
              <dd>
                <button type="button" class="table-tip-trigger" id="rp-baseline" aria-expanded="false" aria-controls="rp-baseline-detail"></button>
                <span class="rp-summary-detail" id="rp-baseline-detail" hidden></span>
              </dd>
            </div>
            <div>
              <dt>투자 가능 RP</dt>
              <dd>
                <button type="button" class="table-tip-trigger" id="rp-budget" aria-expanded="false" aria-controls="rp-budget-detail"></button>
                <span class="rp-summary-detail" id="rp-budget-detail" hidden></span>
              </dd>
            </div>
            <div class="rp-summary-highlight">
              <dt>추천 투자 RP</dt>
              <dd>
                <button type="button" class="table-tip-trigger" id="rp-spent" aria-expanded="false" aria-controls="rp-spent-detail"></button>
                <span class="rp-summary-detail" id="rp-spent-detail" hidden></span>
              </dd>
            </div>
            <div>
              <dt>남은 RP</dt>
              <dd>
                <button type="button" class="table-tip-trigger" id="rp-left" aria-expanded="false" aria-controls="rp-left-detail"></button>
                <span class="rp-summary-detail" id="rp-left-detail" hidden></span>
              </dd>
            </div>
          </dl>
          <div class="rp-results-table">
            <table>
              <thead><tr><th>스킬</th><th>시작 레벨</th><th>목표 레벨</th><th>필요 RP</th><th>목표 레벨 효과</th></tr></thead>
              <tbody id="rp-rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="./rp-planner-engine.js"></script>
  <script type="module" src="./rp-skill-recommend.js"></script>
</body>
</html>
