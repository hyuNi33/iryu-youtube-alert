<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf6ff">
  <title>페이지를 찾을 수 없습니다 | 이류월드</title>
  <script>
    (function () {
      var preference = 'system';
      try { preference = localStorage.getItem('iryu_theme') || 'system'; } catch (error) {}
      var dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #edf7ff; --card: #fff; --text: #203b55; --muted: #63778b; --line: #dcebf7; --accent: #236dc2; --soft: #f3f9ff; --shadow: rgba(39, 96, 145, .09); }
    html[data-theme="dark"] { color-scheme: dark; --bg: #101b2a; --card: #1b2a3c; --text: #e5eff9; --muted: #acbfd2; --line: #35485f; --accent: #87c4ff; --soft: #23354b; --shadow: rgba(0, 0, 0, .2); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--text); font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-size: 17px; font-weight: 800; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; background: var(--accent); color: var(--card); border-radius: 10px; font-size: 16px; }
    header { padding: 28px clamp(24px, 6vw, 80px); }
    main { padding: 28px 24px 48px; display: grid; place-items: center; }
    .error-card { position: relative; width: min(100%, 640px); padding: 52px 44px 40px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: 0 20px 70px var(--shadow); text-align: center; overflow: hidden; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .07em; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .error-code { margin: 24px 0 12px; color: var(--accent); font-size: clamp(100px, 22vw, 156px); line-height: 1; font-weight: 900; letter-spacing: -.07em; padding-right: .07em; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); line-height: 1.45; letter-spacing: -.05em; word-break: keep-all; }
    .description { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.85; word-break: keep-all; }
    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 32px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 12px 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); text-decoration: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
    .button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--shadow); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .button svg { width: 18px; height: 18px; flex-shrink: 0; }
    .hint { margin: 32px 0 0; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.7; word-break: keep-all; }
    footer { padding: 0 24px 24px; text-align: center; font-size: 12px; color: var(--muted); }
    @media (max-width: 480px) { header { padding: 22px 24px; } main { padding: 16px 20px 32px; } .error-card { padding: 36px 22px 28px; border-radius: 22px; } .actions { flex-direction: column; gap: 10px; margin-top: 26px; } .button { width: 100%; } .description { font-size: 14px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } .button:hover { transform: none; } }
  </style>
</head>
<body>
  <header><a class="brand" href="/" aria-label="이류월드 홈"><span class="brand-mark" aria-hidden="true">이</span>이류월드</a></header>
  <main>
    <section class="error-card" aria-labelledby="error-title">
      <span class="status">PAGE NOT FOUND</span>
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="error-title">페이지를 찾을 수 없습니다</h1>
      <p class="description">주소가 변경되었거나 삭제된 페이지입니다.<br>입력하신 주소를 다시 확인해 주세요.</p>
      <!--
      <div class="actions">
        <a class="button primary" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
          홈으로 이동
        </a>
        <button class="button" type="button" id="back-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6-6 6 6 6M4 12h16"/></svg>
          이전 페이지
        </button>
      </div>
      <p class="hint">찾으시는 계산기와 정보는 홈에서 확인하실 수 있습니다.</p>
      -->
    </section>
  </main>
  <footer>이류월드 · 계산기 &amp; 정보</footer>
  <script>
    document.getElementById('back-button').addEventListener('click', function () {
      if (history.length > 1) history.back();
      else location.assign('/');
    });
  </script>
</body>
</html>
